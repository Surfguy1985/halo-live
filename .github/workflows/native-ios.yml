name: Native iOS CI

on:
  push:
    branches:
      - ios-swift-native-v1
    paths:
      - "NativeiOS/**"
      - ".github/workflows/native-ios.yml"
  pull_request:
    paths:
      - "NativeiOS/**"

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: NativeiOS
        run: xcodegen generate

      - name: Validate WidgetKit extension metadata
        working-directory: NativeiOS
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' HaloFieldWidgets/Info.plist)" = "com.apple.widgetkit-extension"

      - name: App Store static readiness gates
        working-directory: NativeiOS
        run: bash scripts/app-store-readiness.sh

      - name: Native crash-safety audit
        working-directory: NativeiOS
        run: bash scripts/native-safety-audit.sh

      - name: Pick available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"]))
          for runtime, devices in data["devices"].items():
              for d in devices:
                  if d["isAvailable"] and d["name"].startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          PY
          )
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: NativeiOS
        run: |
          xcodebuild test \
            -project HaloField.xcodeproj \
            -scheme HaloField \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate unsigned Release archive
        working-directory: NativeiOS
        run: |
          rm -rf build/HaloField.xcarchive
          xcodebuild archive \
            -project HaloField.xcodeproj \
            -scheme HaloField \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/HaloField.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
          test -d build/HaloField.xcarchive/Products/Applications/HaloField.app
          test -f build/HaloField.xcarchive/Products/Applications/HaloField.app/PrivacyInfo.xcprivacy
