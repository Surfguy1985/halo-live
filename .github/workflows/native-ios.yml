name: Native iOS CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - ios-swift-native-v1
      - release/halo-workflow-rc1-candidate
    paths:
      - "NativeiOS/**"
      - ".github/workflows/native-ios.yml"
  pull_request:
    paths:
      - "NativeiOS/**"

concurrency:
  group: native-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: NativeiOS
        run: xcodegen generate

      - name: Validate WidgetKit extension metadata
        working-directory: NativeiOS
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' HaloFieldWidgets/Info.plist)" = "com.apple.widgetkit-extension"

      - name: App Store static readiness gates
        working-directory: NativeiOS
        run: bash scripts/app-store-readiness.sh

      - name: Native crash-safety audit
        working-directory: NativeiOS
        run: bash scripts/native-safety-audit.sh

      - name: Pick available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","--json"]))
          for runtime, devices in data["devices"].items():
              for d in devices:
                  if d["isAvailable"] and d["name"].startswith("iPhone"):
                      print(d["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          PY
          )
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Cross-language Swift JSON to Node publisher contract
        run: |
          swiftc -o "$RUNNER_TEMP/halo-workflow-wire" \
            NativeiOS/HaloField/Domain/HaloWorkflowBlocks.swift \
            NativeiOS/HaloField/Domain/HaloTemplatePublishing.swift \
            NativeiOS/TestsSupport/WorkflowWireFixture.swift
          "$RUNNER_TEMP/halo-workflow-wire" > "$RUNNER_TEMP/halo-workflow-proposal.json"
          node -e 'const fs=require("fs");const assert=require("node:assert/strict");assert.deepStrictEqual(JSON.parse(fs.readFileSync(process.argv[1])),JSON.parse(fs.readFileSync(process.argv[2])))' \
            "$RUNNER_TEMP/halo-workflow-proposal.json" enterprise/workflow-publishing/fixtures/swift-publish-v1.json
          HALO_SWIFT_WIRE_FIXTURE="$RUNNER_TEMP/halo-workflow-proposal.json" \
            node --test enterprise/workflow-publishing/swift-wire-integration.test.mjs

      - name: Build and test
        working-directory: NativeiOS
        run: |
          xcodebuild test \
            -project HaloField.xcodeproj \
            -scheme HaloField \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate unsigned Release archive
        working-directory: NativeiOS
        run: |
          rm -rf build/HaloField.xcarchive
          xcodebuild archive \
            -project HaloField.xcodeproj \
            -scheme HaloField \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/HaloField.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
          test -d build/HaloField.xcarchive/Products/Applications/HaloField.app
          test -f build/HaloField.xcarchive/Products/Applications/HaloField.app/PrivacyInfo.xcprivacy
