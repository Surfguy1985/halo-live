name: Workflow PostgreSQL Integration
on:
  push:
    branches:
      - 'release/halo-workflow-rc1-candidate'
    paths:
      - 'enterprise/workflow-publishing/**'
      - '.github/workflows/workflow-postgres-integration.yml'
  pull_request:
    paths:
      - 'enterprise/workflow-publishing/**'
      - '.github/workflows/workflow-postgres-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
# Superseded commits on the same PR should not monopolize runner capacity.
concurrency:
  group: workflow-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: postgres
          POSTGRES_DB: halo_test_workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d halo_test_workflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      HALO_WORKFLOW_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/halo_test_workflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated dependencies
        run: npm install --prefix enterprise/workflow-publishing --no-audit --no-fund
      - name: JavaScript syntax preflight
        run: find enterprise/workflow-publishing -maxdepth 1 -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check
      - name: Domain and adapter protocol tests
        run: timeout --signal=TERM --kill-after=20s 8m npm test --prefix enterprise/workflow-publishing
      - name: Real PostgreSQL integration tests
        run: timeout --signal=TERM --kill-after=20s 12m npm run test:postgres --prefix enterprise/workflow-publishing
