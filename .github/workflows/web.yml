name: Web Build

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/halo-workflow-rc1-candidate
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'enterprise/workflow-publishing/package-lock.json'
      - 'scripts/check-dependency-licenses.mjs'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'enterprise/workflow-publishing/package-lock.json'
      - 'scripts/check-dependency-licenses.mjs'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/web.yml'

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=moderate
      - name: Dependency license gate
        run: npm run audit:licenses
      - name: Source lint
        run: npm exec -- oxlint src
      - name: Production build
        run: npm run build
