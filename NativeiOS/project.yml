name: HaloField
options:
  bundleIdPrefix: com.archangel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.archangel.halofield

targets:
  HaloShared:
    type: framework
    platform: iOS
    sources:
      - HaloShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archangel.halofield.shared
        SKIP_INSTALL: YES

  HaloFieldWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HaloFieldWidgets
    dependencies:
      - target: HaloShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archangel.halofield.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SKIP_INSTALL: YES

  HaloField:
    type: application
    platform: iOS
    sources:
      - HaloField
    dependencies:
      - target: HaloShared
      - target: HaloFieldWidgets
        embed: true
    info:
      path: HaloField/Info.plist
      properties:
        CFBundleDisplayName: HALO
        UILaunchScreen: {}
        NSSupportsLiveActivities: YES
        NSCameraUsageDescription: HALO uses the camera to document verified field work.
        NSLocationWhenInUseUsageDescription: HALO uses your location to verify job check-in and route you to assigned work.
        NSPhotoLibraryUsageDescription: HALO lets you attach existing job photos when needed.
        UIBackgroundModes:
          - location
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.archangel.halofield.activation
            CFBundleURLSchemes:
              - halo
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

  HaloFieldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HaloFieldTests
    dependencies:
      - target: HaloField
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archangel.halofield.tests
        GENERATE_INFOPLIST_FILE: YES
