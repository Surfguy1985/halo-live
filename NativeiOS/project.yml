name: HaloField
options:
  bundleIdPrefix: com.archangel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    PRODUCT_BUNDLE_IDENTIFIER: com.archangel.halofield

targets:
  HaloFieldWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HaloFieldWidgets
      - HaloShared
    info:
      path: HaloFieldWidgets/Info.plist
      properties:
        CFBundleDisplayName: HALO
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archangel.halofield.widgets
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  HaloField:
    type: application
    platform: iOS
    sources:
      - HaloField
      - HaloShared
    dependencies:
      - target: HaloFieldWidgets
        embed: true
    info:
      path: HaloField/Info.plist
      properties:
        CFBundleDisplayName: HALO
        UILaunchScreen: {}
        NSSupportsLiveActivities: YES
        NSCameraUsageDescription: HALO uses the camera to document verified field work.
        NSLocationWhenInUseUsageDescription: HALO uses your location to verify job check-in and route you to assigned work.
        NSLocationAlwaysAndWhenInUseUsageDescription: HALO uses background location only while you explicitly share live crew location with the office.
        NSPhotoLibraryUsageDescription: HALO lets you attach existing job photos when needed.
        UIBackgroundModes:
          - location
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.archangel.halofield.activation
            CFBundleURLSchemes:
              - halo
    entitlements:
      path: HaloField/HaloField.entitlements
      properties:
        aps-environment: "$(APS_ENVIRONMENT)"
    settings:
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
      base:
        TARGETED_DEVICE_FAMILY: "1"
        APS_ENVIRONMENT: development
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: HaloField/HaloField.entitlements
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
      configs:
        Release:
          APS_ENVIRONMENT: production

  HaloFieldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HaloFieldTests
    dependencies:
      - target: HaloField
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.archangel.halofield.tests
        GENERATE_INFOPLIST_FILE: YES
